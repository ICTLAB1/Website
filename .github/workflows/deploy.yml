name: Deploy to production

# Manual on purpose. This runs the same four commands documented in
# deploy/README.md section 9 against the live Azure VM, on a site that takes
# real payments — a push-triggered deploy would mean every commit to `main`
# goes live unattended, with no chance to notice a problem before it does.
# Change `on:` to include `push: { branches: [main] }` if that trade-off is
# ever wanted; nothing else here needs to change.
on:
  workflow_dispatch: {}

# Only one deploy at a time, and a second manual run waits for the first
# rather than racing it — `docker compose up -d --build` on the same host
# from two directions at once is not something to find out about by accident.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # The gate. Deployment is manual, but "manual" only means a person chose the
  # moment — it never meant the code had been checked. Before this job existed
  # the deploy step ran `git pull && docker compose up -d --build` against the
  # live VM from whatever `main` happened to contain, and the build inside the
  # container was the first thing to look at the code at all. A type error, a
  # failing test or a lint violation reached production and was discovered
  # there.
  #
  # These are the same checks ci.yml runs on every pull request, repeated here
  # rather than trusted from an earlier run: a successful CI run proves
  # something about the commit it ran on, and a manual deploy can be fired at
  # any ref at any later time. Re-running them costs a few minutes of a
  # deployment that happens by hand anyway.
  verify:
    name: Mandatory checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Compiles without reaching a database; Prisma's client generation
          # only needs a well-formed URL.
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

  deploy:
    # Nothing reaches the VM unless the checks above passed. `needs` is the
    # whole mechanism: a failure in `verify` leaves this job skipped, and a
    # skipped deploy is the correct outcome for code that does not compile.
    needs: verify
    # Named so that required reviewers can be attached to it in the
    # repository's Environments settings — the one piece of this that cannot
    # be expressed in a workflow file. Without reviewers configured this
    # behaves exactly as before (whoever can dispatch the workflow deploys);
    # with them, a second person has to approve each production deploy.
    environment: production
    runs-on: ubuntu-latest
    # Five minutes covers a git pull and a Docker rebuild comfortably; a hang
    # here almost always means the SSH connection itself is stuck, not that
    # the deploy is slow, and this stops it burning Actions minutes at a
    # runner that will never come back.
    timeout-minutes: 15
    env:
      # Passed as real environment variables rather than interpolated with
      # `${{ }}` inside a `run:` string — a secret substituted straight into
      # a shell script's source is a script-injection risk if its value ever
      # contained a shell-special character; an env var is just a value, read
      # by the shell rather than pasted into it.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      # Server-only. Piped to the VM over ssh stdin (never on a command line)
      # and written into deploy/.env by deploy/set-env.sh. Empty = leave the
      # VM's .env as it is.
      META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # DEPLOY_HOST_KEY is the output of `ssh-keyscan -H <host>`, run once
          # by hand and pinned as a repository secret. It is now required.
          #
          # This used to fall back to `ssh-keyscan` at deploy time when the
          # secret was absent — trust on first use, on every run. That is not
          # a weaker version of host-key verification; it is none at all.
          # Whoever answers on port 22 at that moment is accepted and handed a
          # deploy key, so anyone able to sit between the runner and the VM for
          # one run takes the credential and the deployment with it. The
          # fallback also hid its own absence: a deployment with no pinned key
          # looked exactly like a deployment with one.
          #
          # Failing here is the point. A deploy that cannot prove which machine
          # it is talking to should stop, not proceed hopefully.
          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "::error::DEPLOY_HOST_KEY is not set. Pin the host key before deploying:" >&2
            echo "  ssh-keyscan -H <host>   # run once, from somewhere you trust" >&2
            echo "  then save the output as the DEPLOY_HOST_KEY repository secret." >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          # The token is the only thing on ssh's stdin, and printf is a shell
          # builtin, so it appears in no process list. No `set -x` anywhere in
          # this step: that is what would echo it.
          # Whether a token was supplied, told to the VM so it knows whether a
          # missing one in the container is a failure or just not configured yet.
          expect_meta=0
          if [ -n "$META_CAPI_TOKEN" ]; then expect_meta=1; fi
          printf '%s' "$META_CAPI_TOKEN" | ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "expect_meta=$expect_meta; "'set -eu
             # The repo (owned by azureuser) lives at /home/azureuser/app.
             # Pull as azureuser, not root: azureuser already has GitHub'"'"'s
             # host key and the credentials this checkout authenticates
             # with, and running as its own owner sidesteps git'"'"'s
             # dubious-ownership check (CVE-2022-24765) entirely.
             sudo -u azureuser git -C /home/azureuser/app pull
             # Write the Meta token into deploy/.env, from stdin. Must run before
             # anything else here reads stdin; nothing below does (each is
             # redirected from /dev/null). Prints the length, never the value.
             sudo bash /home/azureuser/app/deploy/set-env.sh META_CAPI_TOKEN
             # ── Ownership of the data volumes ──────────────────────────────
             #
             # The image now runs as `node` rather than root. Docker applies
             # the image'"'"'s ownership of /data only when it *initialises* an
             # empty named volume, and techzoid_uploads and techzoid_documents
             # already hold files — so they stay root-owned and the
             # unprivileged app cannot write to them.
             #
             # Nothing looks wrong when that happens. The site serves, the
             # health check passes, and the first logo upload or purchase-order
             # attachment fails with EACCES. That is a customer finding it.
             #
             # So it is done here rather than left as a step in the README for
             # somebody to remember once. It runs as root in a throwaway
             # container, is idempotent, costs a second, and is a no-op on
             # every deploy after the first. It runs *before* the new image
             # starts, so there is no window where the app is up against
             # volumes it cannot write to.
             #
             # Plain `docker run`, not `docker compose run`, and that is the
             # whole point of the shape. The app service drops every
             # capability, and `compose run` inherits the service'"'"'s security
             # options — so CAP_CHOWN is gone and even `--user root` cannot
             # chown. The first attempt at this failed exactly that way:
             # "chown: changing ownership of '"'"'/data/uploads'"'"': Operation not
             # permitted". A throwaway container outside the compose service
             # has its default capabilities and can.
             #
             # uid 1000 is `node` in the official node images, which this one
             # is built from. That is asserted in ci.yml rather than trusted,
             # so a base image that ever changed it fails there and not here.
             sudo docker run --rm \
               -v techzoid_uploads:/data/uploads \
               -v techzoid_documents:/data/documents \
               alpine:3 sh -c '"'"'chown -R 1000:1000 /data/uploads /data/documents && echo "data volumes owned by uid 1000"'"'"' </dev/null
             # `cd` is a shell builtin, so it cannot be sudo'"'"'ed on its own —
             # it would run as the unprivileged deploy user, which cannot even
             # traverse into azureuser'"'"'s home directory. --project-directory
             # keeps the whole docker compose invocation, cd included, under
             # one sudo.
             sudo docker compose --project-directory /home/azureuser/app/deploy \
               -f /home/azureuser/app/deploy/docker-compose.prod.yml up -d --build </dev/null
             # `up -d` recreates the container when its environment changed, so
             # a new token takes effect here. Then ask the running container what
             # it sees: the length of the token and whether Meta accepts it, never the
             # token. Waits for the container to come up first.
             compose="sudo docker compose --project-directory /home/azureuser/app/deploy -f /home/azureuser/app/deploy/docker-compose.prod.yml"
             for i in $(seq 1 30); do
               $compose exec -T app true </dev/null >/dev/null 2>&1 && break
               sleep 2
             done
             rc=0
             # Read as root: the file is in the azureuser home directory, which this user cannot open.
             sudo cat /home/azureuser/app/deploy/check-meta.mjs | $compose exec -T app node - || rc=$?
             # Exit 4 means the token is in the container but Meta did not accept the
             # check call (for example a missing permission on a read that sending events
             # does not need). That is worth a warning, not a failed release. Any other
             # failure, including a token that never reached the container, still fails.
             if [ "$expect_meta" = 1 ] && [ "$rc" -eq 4 ]; then echo "::warning::META_CAPI_TOKEN is present in the container but Meta did not confirm it (exit 4); send a test event from Events Manager to verify"; rc=0; fi
             if [ "$expect_meta" = 1 ] && [ "$rc" -ne 0 ]; then echo "::error::could not confirm the app container has a working META_CAPI_TOKEN (exit $rc)"; exit 1; fi
             if [ "$rc" -eq 3 ]; then echo "META_CAPI_TOKEN is not configured (no secret supplied)"; fi'
